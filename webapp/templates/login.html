<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — N3RAH BOOK Billing & Inventory</title>
  <link rel="icon" type="image/x-icon" href="/assets/app_icon.ico">
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .ambient-glow-1 {
      position: absolute;
      top: -10%;
      left: -10%;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.18) 0%, transparent 65%);
      pointer-events: none;
    }

    .ambient-glow-2 {
      position: absolute;
      bottom: -10%;
      right: -10%;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.15) 0%, transparent 65%);
      pointer-events: none;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: rgba(17, 27, 49, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: var(--radius-xl);
      padding: 40px 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 35px var(--accent-primary-glow);
      position: relative;
      z-index: 10;
      animation: floatUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes floatUp {
      from { opacity: 0; transform: translateY(20px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-brand-logo {
      width: 76px;
      height: 76px;
      margin: 0 auto 16px;
      border-radius: var(--radius-md);
      box-shadow: 0 8px 25px var(--accent-primary-glow);
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      overflow: hidden;
    }

    .login-brand-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .login-title {
      font-size: 1.65rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #ffffff 40%, var(--accent-cyan) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .login-subtitle {
      font-size: 0.84rem;
      color: var(--text-muted);
    }

    .login-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .login-input-wrap {
      position: relative;
    }

    .login-input-wrap input {
      width: 100%;
      padding: 13px 16px 13px 44px;
      background: rgba(11, 18, 34, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: var(--radius-md);
      color: var(--text-main);
      font-size: 0.94rem;
      outline: none;
      transition: all var(--transition-fast);
    }

    .login-input-wrap input:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px var(--accent-primary-glow);
    }

    .login-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-toggle-pw {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 4px;
    }

    .login-toggle-pw:hover {
      color: var(--text-main);
    }

    .login-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .remember-me input {
      accent-color: var(--accent-primary);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .login-submit-btn {
      width: 100%;
      padding: 13px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, var(--accent-primary) 0%, #4338ca 100%);
      color: white;
      border: none;
      cursor: pointer;
      box-shadow: 0 6px 20px var(--accent-primary-glow);
      transition: all var(--transition-fast);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .login-submit-btn:hover {
      background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
      box-shadow: 0 8px 25px var(--accent-primary-glow);
      transform: translateY(-1px);
    }

    .login-submit-btn:active {
      transform: translateY(0);
    }

    .login-error-alert {
      display: none;
      background: var(--danger-bg);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #fca5a5;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.84rem;
      align-items: center;
      gap: 10px;
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-5px); }
      40%, 80% { transform: translateX(5px); }
    }

    .company-footer-tag {
      text-align: center;
      margin-top: 24px;
      font-size: 0.76rem;
      color: var(--text-dim);
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <div class="login-card">
      <div class="login-brand">
        <div class="login-brand-logo">
          <img src="/assets/logo_icon.png" alt="Logo" onerror="this.onerror=null; this.src='/assets/logo.png'">
        </div>
        <h1 class="login-title">N3RAH BOOK</h1>
        <p class="login-subtitle">Enterprise Billing & Inventory Portal</p>
      </div>

      <div id="errorAlert" class="login-error-alert">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
        <span id="errorMessage">Invalid credentials</span>
      </div>

      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <div class="login-input-wrap">
            <span class="login-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </span>
            <input type="text" id="username" name="username" placeholder="Enter username" value="admin" required autofocus>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="login-input-wrap">
            <span class="login-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            </span>
            <input type="password" id="password" name="password" placeholder="Enter password" required>
            <button type="button" class="login-toggle-pw" id="togglePwBtn" title="Toggle password visibility">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>

        <div class="login-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe" checked>
            <span>Remember login</span>
          </label>
        </div>

        <button type="submit" class="login-submit-btn" id="submitBtn">
          <span class="spinner" id="btnSpinner"></span>
          <span id="btnText">Sign In to Dashboard</span>
        </button>
      </form>

      <div class="company-footer-tag">
        {{ company.name if company and company.name else 'N3RAH BOOK' }} &bull; Secure Session
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const submitBtn = document.getElementById('submitBtn');
    const btnSpinner = document.getElementById('btnSpinner');
    const btnText = document.getElementById('btnText');
    const errorAlert = document.getElementById('errorAlert');
    const errorMessage = document.getElementById('errorMessage');
    const togglePwBtn = document.getElementById('togglePwBtn');
    const passwordInput = document.getElementById('password');

    togglePwBtn.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.style.display = 'none';

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      const remember = document.getElementById('rememberMe').checked;

      if (!username || !password) {
        showError('Please enter both username and password.');
        return;
      }

      submitBtn.disabled = true;
      btnSpinner.style.display = 'inline-block';
      btnText.textContent = 'Authenticating...';

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password, remember })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          btnText.textContent = 'Access Granted! Redirecting...';
          submitBtn.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
          setTimeout(() => {
            window.location.href = '/';
          }, 400);
        } else {
          showError(data.error || 'Invalid credentials. Please try again.');
          resetBtn();
        }
      } catch (err) {
        showError('Network error connecting to server. Please check your connection.');
        resetBtn();
      }
    });

    function showError(msg) {
      errorMessage.textContent = msg;
      errorAlert.style.display = 'flex';
    }

    function resetBtn() {
      submitBtn.disabled = false;
      btnSpinner.style.display = 'none';
      btnText.textContent = 'Sign In to Dashboard';
    }
  </script>
</body>
</html>
